    <!-- ✅ Use stable MindAR version -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      /* Loading overlay */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: none; /* hidden until start AR is clicked */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        opacity: 1;
        transition: opacity 1s ease;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .progress-container {
        width: 80%;
        height: 20px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: limegreen;
        transition: width 0.2s ease;
      }
      .progress-text {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;
      }
      .status-text {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      /* Start button */
      #start-button {
        position: absolute;
        z-index: 9999;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 16px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #start-button:hover {
        background: #f0f0f0;
        transform: translate(-50%, -50%) translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="status-text" id="status-text">Initializing AR...</div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <button id="start-button">Start AR</button>

    <a-scene
      id="ar-scene"
      style="display: none;"
      mindar-image="imageTargetSrc: targets.mind; uiError: no; uiScanning: no; autoStart: false; maxTrack: 1;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets></a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse;"
        raycaster="near: 10; far: 10000;"
      ></a-camera>

      <!-- AR targets -->
      <!-- (kept the same as before) -->
      <!-- Example -->
      <a-entity id="target-0" mindar-image-target="targetIndex: 0">
        <a-plane
          position="0 0 0"
          height="0.552"
          width="1"
          rotation="0 0 0"
          src="images/0_Love_Is.jpg"
          visible="false"
        ></a-plane>
      </a-entity>
      <!-- Repeat for all targets... -->
      <!-- last -->
      <a-entity id="target-15" mindar-image-target="targetIndex: 15">
        <a-plane
          position="0 0 0"
          height="0.552"
          width="1"
          rotation="0 0 0"
          src="images/15_JoySmile.jpg"
          visible="false"
        ></a-plane>
      </a-entity>
    </a-scene>

    <script>
  const NUM_TARGETS = 16;
  const startButton = document.getElementById('start-button');
  const sceneEl = document.querySelector('a-scene');
  const loadingScreen = document.getElementById('loading-screen');
  const progressBar = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  const statusText = document.getElementById('status-text');

  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffers = {};
  let currentSource = null;
  let currentPlayingIndex = null;
  let targetFoundTimers = {};
  let targetLostTimers = {};
  const DEBOUNCE_DELAY = 500;

  let firstSongReady = false;

  let totalSteps = NUM_TARGETS + 2;
  let completedSteps = 0;

  const updateProgress = () => {
    let percent = Math.round((completedSteps / totalSteps) * 100);
    progressBar.style.width = percent + '%';
    progressText.textContent = percent + '%';
  };

  const markStepComplete = (msg) => {
    completedSteps++;
    updateProgress();
    if (msg) statusText.textContent = msg;
    if (completedSteps >= totalSteps) {
      statusText.textContent = 'AR Ready!';
      setTimeout(() => {
        loadingScreen.classList.add('fade-out');
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 1000);
      }, 500);
    }
  };

  const stopAllAudio = () => {
    if (currentSource) {
      try {
        currentSource.stop();
        currentSource.disconnect();
      } catch (e) {}
      currentSource = null;
    }
    currentPlayingIndex = null;
  };

  const playAudio = (index) => {
    if (index === 0 && !firstSongReady) return;

    stopAllAudio();
    const buffer = audioBuffers[index];
    if (!buffer) return;

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    source.connect(audioContext.destination);
    source.start(0);
    currentSource = source;
    currentPlayingIndex = index;
  };

  const loadAudio = async (index) => {
    const response = await fetch(`audio/mp3/audio${index}.mp3`);
    const arrayBuffer = await response.arrayBuffer();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    audioBuffers[index] = audioBuffer;
    markStepComplete(`Loading audio ${index + 1}/${NUM_TARGETS}`);
  };

  const loadAllAudio = async () => {
    statusText.textContent = 'Loading audio files...';
    for (let i = 0; i < NUM_TARGETS; i++) {
      await loadAudio(i);
    }
  };

  let arSystemReady = false;
  let arSystem;

  sceneEl.addEventListener('loaded', () => {
    arSystem = sceneEl.systems['mindar-image-system'];
    arSystemReady = true;
    markStepComplete('AR system initialized');
  });

  startButton.addEventListener('click', async () => {
    startButton.style.display = 'none';
    sceneEl.style.display = 'block';
    loadingScreen.style.display = 'flex';

    // 🔥 iOS 17+/18 FIX — User gesture–triggered camera permission
    try {
      await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" }
      });
      console.log("Camera permission granted.");
    } catch (err) {
      console.error("Camera permission denied:", err);
      statusText.textContent = "Camera access is required to start AR.";
      return;
    }

    // Give iOS a moment to unlock the camera
    setTimeout(async () => {
      try {
        if (!arSystemReady) {
          arSystem = sceneEl.systems['mindar-image-system'];
        }
        if (arSystem && !arSystem.isStarted) {
  console.log('Starting MindAR after permission...');

  // Force the camera video element to attach for iOS
  const cameraEl = document.querySelector('a-camera');
  const videoEl = sceneEl.renderer.xr?.getCamera?.() || document.createElement('video');
  cameraEl.object3D.visible = true; // ensure camera is active
  if (!videoEl.srcObject) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      videoEl.srcObject = stream;
      await videoEl.play();
    } catch (err) {
      console.error('Camera attach failed:', err);
    }
  }

  await arSystem.start();
  console.log('MindAR started.');
  markStepComplete('Camera tracking ready');
}

      } catch (err) {
        console.error('Error starting AR system:', err);
      }
    }, 300);

    // Resume audio
    try {
      await audioContext.resume();
    } catch (err) {}

    loadAllAudio();

    // Target event listeners
    for (let i = 0; i < NUM_TARGETS; i++) {
      const target = document.querySelector(`#target-${i}`);
      if (!target) continue;

      target.addEventListener('targetFound', () => {
        if (targetLostTimers[i]) {
          clearTimeout(targetLostTimers[i]);
          delete targetLostTimers[i];
        }
        if (targetFoundTimers[i]) {
          clearTimeout(targetFoundTimers[i]);
        }
        targetFoundTimers[i] = setTimeout(() => {
          if (i === 0) firstSongReady = true;
          if (currentPlayingIndex !== i) {
            playAudio(i);
          }
          delete targetFoundTimers[i];
        }, DEBOUNCE_DELAY);
      });

      target.addEventListener('targetLost', () => {
        if (targetFoundTimers[i]) {
          clearTimeout(targetFoundTimers[i]);
          delete targetFoundTimers[i];
        }
        if (targetLostTimers[i]) {
          clearTimeout(targetLostTimers[i]);
        }
        targetLostTimers[i] = setTimeout(() => {
          delete targetLostTimers[i];
        }, DEBOUNCE_DELAY);
      });
    }
  });
</script>

  </body>
