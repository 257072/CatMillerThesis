<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      /* Loading overlay */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: none; /* hidden until start AR is clicked */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        opacity: 1;
        transition: opacity 1s ease;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Progress bar */
      .progress-container {
        width: 80%;
        height: 20px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: limegreen;
        transition: width 0.2s ease;
      }
      .progress-text {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;

      }
      .status-text {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      /* Start button */
      #start-button {
        position: absolute;
        z-index: 9999;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 16px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #start-button:hover {
        background: #f0f0f0;
        transform: translate(-50%, -50%) translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="status-text" id="status-text">Initializing AR...</div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <button id="start-button">Start AR</button>
    
    <a-scene
      id="ar-scene"
      style="display: none;"
      mindar-image="imageTargetSrc: targets.mind; uiError:no; uiScanning:no; autoStart: false; maxTrack: 1;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets></a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse;"
        raycaster="near: 10; far: 10000;"
      ></a-camera>
      
      <!-- AR targets -->
      <a-entity id="target-0" mindar-image-target="targetIndex: 0">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/0_Love_Is.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/1_Awakened.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/2_Angels_On_Earth.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-3" mindar-image-target="targetIndex: 3">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/3_Polaris.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-4" mindar-image-target="targetIndex: 4">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/4_Holiness_Of_The_Heart.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-5" mindar-image-target="targetIndex: 5">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/5_WLTM_GSOH.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-6" mindar-image-target="targetIndex: 6">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/6_Prayer_Song.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-7" mindar-image-target="targetIndex: 7">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/7_New_Now.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-8" mindar-image-target="targetIndex: 8">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/8_Kaleidoscope_Memories.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-9" mindar-image-target="targetIndex: 9">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/9_Elixir_Of_Love.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-10" mindar-image-target="targetIndex: 10">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/10_Love_Made_Visible.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-11" mindar-image-target="targetIndex: 11">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/11_Love_Made_Visible.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-12" mindar-image-target="targetIndex: 12">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/12_Reflections.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-13" mindar-image-target="targetIndex: 13">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/13_swim.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-14" mindar-image-target="targetIndex: 14">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/14_SelfMastery.jpg" visible="false"></a-plane>
      </a-entity>
      <a-entity id="target-15" mindar-image-target="targetIndex: 15">
        <a-plane position="0 0 0" height="0.552" width="1" rotation="0 0 0" src="images/15_JoySmile.jpg" visible="false"></a-plane>
      </a-entity>

    </a-scene>

    <script>
      const NUM_TARGETS = 16; // Update this to match the number of targets
      const startButton = document.getElementById("start-button");
      const sceneEl = document.querySelector("a-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const progressBar = document.getElementById("progress-bar");
      const progressText = document.getElementById("progress-text");
      const statusText = document.getElementById("status-text");

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffers = {};
      let currentSource = null;
      let currentPlayingIndex = null;
      let targetFoundTimers = {};
      let targetLostTimers = {};
      const DEBOUNCE_DELAY = 500; // 500ms debounce

      // Progress tracking
      let totalSteps = NUM_TARGETS + 2; // audio files + AR system ready + tracking ready
      let completedSteps = 0;

      const updateProgress = () => {
        let percent = Math.round((completedSteps / totalSteps) * 100);
        progressBar.style.width = percent + "%";
        progressText.textContent = percent + "%";
      };

      const markStepComplete = (statusMessage) => {
        completedSteps++;
        updateProgress();
        if (statusMessage) {
          statusText.textContent = statusMessage;
        }
        
        if (completedSteps >= totalSteps) {
          statusText.textContent = "AR Ready!";
          // Fade out loading screen after a brief delay
          setTimeout(() => {
            loadingScreen.classList.add("fade-out");
            setTimeout(() => {
              loadingScreen.style.display = "none";
            }, 1000);
          }, 500);
        }
      };

      const stopAllAudio = () => {
        if (currentSource) {
          try {
            currentSource.stop();
            currentSource.disconnect();
          } catch (e) {
            console.warn("Error stopping audio:", e);
          }
          currentSource = null;
        }
        currentPlayingIndex = null;
      };

      const playAudio = (index) => {
        stopAllAudio();
        const buffer = audioBuffers[index];
        if (!buffer) return;

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(audioContext.destination);
        source.start(0);

        currentSource = source;
        currentPlayingIndex = index;
      };

      const loadAudio = async (index) => {
        const response = await fetch(`audio/mp3/audio${index}.mp3`);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[index] = audioBuffer;
        markStepComplete(`Loading audio ${index + 1}/${NUM_TARGETS}`);
      };

      const loadAllAudio = async () => {
        statusText.textContent = "Loading audio files...";
        for (let i = 0; i < NUM_TARGETS; i++) {
          await loadAudio(i);
        }
        console.log("All audio buffers loaded");
      };

      let arSystemReady = false;
      let arSystem;

      sceneEl.addEventListener("loaded", () => {
        arSystem = sceneEl.systems["mindar-image-system"];
        arSystemReady = true;
        console.log("A-Frame scene loaded and AR system is ready.");
        markStepComplete("AR system initialized");
      });

      startButton.addEventListener("click", async () => {
        startButton.style.display = "none";
        sceneEl.style.display = "block";
        loadingScreen.style.display = "flex"; // show loading overlay

        try {
          await audioContext.resume();
          console.log("AudioContext resumed");
        } catch (err) {
          console.warn("AudioContext resume failed", err);
        }

        // Start loading audio in background
        loadAllAudio();

        // Start MindAR
        if (arSystemReady && arSystem) {
          arSystem.start();
          // Check when tracking is ready
          setTimeout(() => {
            markStepComplete("Camera tracking ready");
          }, 1000);
        } else {
          sceneEl.addEventListener("loaded", () => {
            arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start();
            console.log("Fallback: AR system started after scene load.");
            // Check when tracking is ready
            setTimeout(() => {
              markStepComplete("Camera tracking ready");
            }, 1000);
          });
        }

        // Add listeners to targets
        for (let i = 0; i < NUM_TARGETS; i++) {
          const target = document.querySelector(`#target-${i}`);
          if (target) {
            target.addEventListener("targetFound", () => {
              // Clear any pending lost timer for this target
              if (targetLostTimers[i]) {
                clearTimeout(targetLostTimers[i]);
                delete targetLostTimers[i];
              }
              
              // Debounce target found events
              if (targetFoundTimers[i]) {
                clearTimeout(targetFoundTimers[i]);
              }
              
              targetFoundTimers[i] = setTimeout(() => {
                console.log(`Target ${i} found (confirmed)`);
                if (currentPlayingIndex !== i) {
                  playAudio(i);
                }
                delete targetFoundTimers[i];
              }, DEBOUNCE_DELAY);
            });

            target.addEventListener("targetLost", () => {
              // Clear any pending found timer for this target
              if (targetFoundTimers[i]) {
                clearTimeout(targetFoundTimers[i]);
                delete targetFoundTimers[i];
              }
              
              // Debounce target lost events
              if (targetLostTimers[i]) {
                clearTimeout(targetLostTimers[i]);
              }
              
              targetLostTimers[i] = setTimeout(() => {
                console.log(`Target ${i} lost (confirmed)`);
                // Keep audio playing even when target is lost
                delete targetLostTimers[i];
              }, DEBOUNCE_DELAY);
            });
          }
        }
      });
    </script>
  </body>
</html>
